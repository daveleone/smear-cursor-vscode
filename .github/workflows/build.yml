name: Build and release VSIX

# Releases are automatic: every push to main computes the next version from the Conventional
# Commits since the last release (see scripts/next-version.mjs), publishes it to the VS Code
# Marketplace and Open VSX, then tags it and creates the GitHub release.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smear-cursor-build-${{ github.ref }}
  # Never cancel a run on main halfway through a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Smear Cursor VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags and history are needed to compute the next version
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Compute version
        id: version
        shell: bash
        run: |
          NEXT="$(node scripts/next-version.mjs)"
          if [ -n "$NEXT" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            RELEASE=true
            npm version "$NEXT" --no-git-tag-version --allow-same-version
          else
            RELEASE=false
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "Version ${VERSION}, release: ${RELEASE}"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=smear-cursor-vscode-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --out "${{ steps.version.outputs.file }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: smear-cursor-vsix-${{ github.sha }}
          path: ${{ steps.version.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      # Publishing skips versions that already exist, so a run that failed halfway can be retried.
      # A missing token skips its store with a warning instead of failing the release.
      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.release == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          FILE: ${{ steps.version.outputs.file }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set, skipping the VS Code Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath "$FILE" --skip-duplicate

      - name: Publish to Open VSX
        if: steps.version.outputs.release == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPVSX_PAT }}
          FILE: ${{ steps.version.outputs.file }}
        shell: bash
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OPVSX_PAT secret is not set, skipping Open VSX"
            exit 0
          fi
          npx ovsx publish "$FILE" --pat "$OVSX_PAT" --skip-duplicate

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.version.outputs.file }}
        shell: bash
        run: |
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smear Cursor $TAG" \
            --generate-notes
